# RunPod docker-compose: VLM service runs in RunPod
# Usage: docker-compose -f docker-compose.runpod.yml up --build

services:
  api:
    build:
      context: ./document-api
      dockerfile: Dockerfile
    container_name: document_api
    ports:
      - "8000:8000"
    env_file:
      - document-api/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: unless-stopped
  