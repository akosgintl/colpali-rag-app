# RunPod docker-compose: VLM service with baked-in models (no volume needed)
# Usage: docker-compose -f docker-compose.runpod.yml up --build

services:
  vlm:
    build:
      context: ./colpali-vlm
      dockerfile: Dockerfile.runpod
    container_name: colpali_vlm_runpod
    ports:
      - "8001:8000"
    env_file:
      - colpali-vlm/.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 600s  # 10 minutes for first-time model download + loading
      retries: 5
    restart: unless-stopped
  api:
    build:
      context: ./document-api
      dockerfile: Dockerfile
    container_name: document_api
    ports:
      - "8000:8000"
    env_file:
      - document-api/.env
    depends_on:
      vlm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: unless-stopped
  