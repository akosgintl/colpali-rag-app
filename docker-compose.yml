# Development docker-compose: runs both VLM and Document API services
# Usage: docker-compose up --build

services:
  vlm:
    build:
      context: ./colpali-vlm
      dockerfile: Dockerfile
    container_name: colpali-vlm
    ports:
      - "8001:8000"
    env_file:
      - colpali-vlm/.env
    volumes:
      # Persist HuggingFace model cache to avoid re-downloading
      - vlm_hf_cache:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 600s  # 10 minutes for first-time model download + loading
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./document-api
      dockerfile: Dockerfile
    container_name: document_api
    ports:
      - "8000:8000"
    env_file:
      - document-api/.env
    depends_on:
      vlm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  vlm_hf_cache:
