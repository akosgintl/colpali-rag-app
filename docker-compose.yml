services:
  api:
    build:
      context: .
      target: deps  # Use deps stage (has all dependencies, but not app code)
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app/src
    volumes:
      # Mount source code for auto-reload
      - ./src:/app/src:ro
      - ./server.py:/app/server.py:ro
      - ./prompts:/app/prompts:ro
      # Persist HuggingFace cache
      - colpali_hf_cache:/root/.cache/huggingface
    command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src", "--reload-dir", "/app"]

volumes:
  colpali_hf_cache:
