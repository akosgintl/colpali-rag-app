[project]
name = "document-api"
version = "1.0.0"
description = "Document ingestion and query API with VLM-powered retrieval"
readme = "README.md"
requires-python = ">=3.12.8"
dependencies = [
    "fastapi[standard]>=0.115.8",
    "gunicorn>=23.0.0",
    "httpx>=0.27.0",
    "openai>=1.50.0",
    "loguru>=0.7.3",
    "pdf2image>=1.17.0",
    "pillow>=10.0.0",
    "pydantic-settings>=2.8.0",
    "pyjwt>=2.8.0",
    "qdrant-client>=1.13.2",
    "slowapi>=0.1.9",
    "supabase>=2.13.0",
    "tenacity>=9.0.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_api"]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]
type = [
    "mypy>=1.15.0",
]

[tool.ruff]
line-length = 80

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
