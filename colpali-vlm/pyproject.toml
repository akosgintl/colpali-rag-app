[project]
name = "colpali-vlm"
version = "1.0.0"
description = "Vision Language Model embedding service using ColQwen2.5"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "colpali-engine",
    "fastapi[standard]>=0.115.8",
    "gunicorn>=23.0.0",
    "loguru>=0.7.3",
    "pillow>=10.0.0",
    "pydantic-settings>=2.8.0",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    # Pin versions for CUDA 12.4 + Ada Lovelace stable stack
    "torch>=2.6.0,<2.7.0",
    "torchvision>=0.21.0,<0.22.0",
    "transformers>=4.44",
    # Quantization libraries (prevent missing dependency errors)
    "accelerate>=0.26.0",
    "cffi",
    "auto-round>=0.5",
    # flash_attn: no PyPI wheel, installed via prebuilt wheel in Dockerfile
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlm"]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]
type = [
    "mypy>=1.15.0",
]

[tool.uv.sources]
colpali-engine = { git = "https://github.com/illuin-tech/colpali" }

[tool.ruff]
line-length = 80

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
